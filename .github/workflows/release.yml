# Push a tag like v0.6.0 -> build the Windows installer on GitHub and publish it as a release.
# The app's auto-updater (electron-updater) reads latest.yml from the newest release.
# Since 1.0 the same release also gets the Android APK (signed with the key in the repository secrets
# ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # a tag pushed again for the same version (e.g. to add the APK) does not rebuild the installer
      - name: Installer already published?
        id: pub
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "DSuperApp-Setup-$V.exe"; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::DSuperApp-Setup-$V.exe is already on the release, not rebuilt"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.pub.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.pub.outputs.skip != '1'
        run: npm ci
      - if: steps.pub.outputs.skip != '1'
        run: npm test
      - if: steps.pub.outputs.skip != '1'
        run: npx vite build
      # create the release first: electron-builder uploads files in parallel and, when no release exists
      # yet, can create two releases for the same tag (v0.8.0 happened), which breaks the download URLs
      - name: Create release
        if: steps.pub.outputs.skip != '1'
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes "Dani SuperApp ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish installer
        if: steps.pub.outputs.skip != '1'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: windows # the release exists by then
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signing key present?
        id: key
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::No ANDROID_KEYSTORE_B64 secret: APK not built here. Add the 4 ANDROID_* secrets to build it in CI."; fi
      # without the signing secrets: attach the APK that was built and signed locally and committed to apk/
      - name: Attach committed APK
        if: ${{ !steps.key.outputs.ok }}
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ -f "apk/DSuperApp-$V.apk" ]; then gh release upload "$GITHUB_REF_NAME" "apk/DSuperApp-$V.apk" --clobber; else echo "::warning::apk/DSuperApp-$V.apk not in the repository either"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok
        with:
          distribution: temurin
          java-version: 21
      - if: steps.key.outputs.ok
        run: npm ci
      - if: steps.key.outputs.ok
        run: npm run build:android
      - name: Build signed APK
        if: steps.key.outputs.ok
        shell: bash
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          DSA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/dsa.jks"
          export DSA_KEYSTORE="$RUNNER_TEMP/dsa.jks"
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Attach APK to the release
        if: steps.key.outputs.ok
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/DSuperApp-*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
